<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--s1:rgba(17,19,31,.72);--s2:rgba(255,255,255,.045);--line:rgba(160,170,255,.14);--tx:#eceef7;--mu:#9aa0bd;--ac:#5eeed6;--ac2:#a284ff;--pk:#ff6fb5;--ok:#7dffb8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Space Grotesk',sans-serif;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main,#tags{position:relative;z-index:1}
.mono,.v{font-family:'JetBrains Mono',monospace}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit;color:var(--tx);background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 14px;outline:none;backdrop-filter:blur(8px)}
input:focus,button:focus-visible{border-color:var(--ac);box-shadow:0 0 0 3px rgba(94,238,214,.18),0 0 18px rgba(94,238,214,.15)}
#lock{position:fixed;inset:0;display:grid;place-items:center;background:rgba(7,8,13,.5);backdrop-filter:blur(6px);z-index:9}
#lock form{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw);padding:28px;background:var(--s1);border:1px solid var(--line);border-radius:18px;box-shadow:0 0 40px rgba(162,132,255,.12)}
#lock h1,header h1{font-size:34px;margin:0 0 4px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--ac),var(--ac2) 60%,var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
#err{color:#ff8fb0;min-height:20px;font-size:13px;margin:0}
.btn{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#08131a;border:0;border-radius:10px;padding:10px 16px;font-weight:700;box-shadow:0 0 18px rgba(94,238,214,.25);transition:box-shadow .2s}
.btn:hover{box-shadow:0 0 26px rgba(162,132,255,.4)}
main{max-width:920px;margin:0 auto;padding:28px 18px 80px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
header h1{font-size:28px;margin:0}
#q{flex:1;min-width:180px;max-width:320px}
#tags{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;padding:12px 0;margin-bottom:12px;background:linear-gradient(rgba(7,8,13,.85) 70%,transparent)}
.tag{background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:5px 14px;color:var(--mu);transition:.15s;backdrop-filter:blur(8px)}
.tag:hover{border-color:var(--ac);color:var(--tx);box-shadow:0 0 14px rgba(94,238,214,.18)}
.tag.on{background:rgba(94,238,214,.12);border-color:var(--ac);color:var(--ac);font-weight:700;box-shadow:0 0 16px rgba(94,238,214,.25)}
#grid{columns:2 340px;column-gap:16px}
.card{--mx:50%;--my:0%;position:relative;break-inside:avoid;margin-bottom:16px;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(162,132,255,.14),transparent 70%),var(--s1);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px;transition:border-color .2s,box-shadow .25s,transform .25s}
.card:hover{border-color:rgba(94,238,214,.45);box-shadow:0 0 28px rgba(94,238,214,.1),0 0 60px rgba(162,132,255,.08);transform:translateY(-2px)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.head h2{margin:0;font-size:19px}
.chips{display:flex;gap:6px;margin:4px 0 10px}
.chips span{font-size:12px;color:var(--ac2)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--s2);border:1px solid transparent;border-radius:10px;padding:8px 10px;margin-top:8px;transition:border-color .15s}
.row:hover{border-color:var(--line)}
.row .k{color:var(--mu);font-size:12px;display:block}
.row .v{font-size:13.5px;word-break:break-all}
.row a.v{color:var(--ac);text-decoration:none}
.row a.v:hover{text-decoration:underline}
.sub{border:1px solid var(--line);border-left:3px solid var(--ac2);border-radius:10px;padding:8px 10px 10px;margin-top:8px;box-shadow:-6px 0 16px -10px var(--ac2)}
.sub>.head h3{margin:0;font-size:13px;color:var(--mu);font-weight:500}
.cp{background:transparent;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;flex:none;color:var(--mu);transition:.15s;font-size:14px}
.cp:hover{color:var(--ac);border-color:var(--ac);box-shadow:0 0 12px rgba(94,238,214,.3)}
.cp.done{color:var(--ok);border-color:var(--ok);box-shadow:0 0 14px rgba(125,255,184,.35)}
#toast{position:fixed;z-index:20;bottom:22px;left:50%;transform:translate(-50%,20px);background:rgba(17,19,31,.9);border:1px solid var(--ok);color:var(--ok);padding:8px 16px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 0 20px rgba(125,255,184,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--mu);text-align:center;padding:40px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<canvas id="bg"></canvas>

<div id="lock"><form id="f">
  <h1>Vault</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
  <p id="err"></p>
  <button class="btn">Unlock</button>
</form></div>

<main id="app" hidden>
  <header><h1>Vault</h1><input id="q" placeholder="Search…"></header>
  <div id="tags"></div>
  <div id="grid"></div>
</main>
<div id="toast">Copied</div>

<script>
const $=s=>document.querySelector(s), b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let items=[], active='all', query='';

async function decrypt(pw){
  const base=/\/$|\.\w+$/.test(location.pathname)?'':location.pathname+'/';
  const r=await fetch(base+'data.enc.json',{cache:'no-store'}); const j=await r.json();
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(j.salt),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(j.iv)},key,b64(j.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
$('#f').onsubmit=async e=>{
  e.preventDefault(); $('#err').textContent='';
  try{ items=(await decrypt($('#pw').value)).items||[]; $('#lock').remove(); $('#app').hidden=false; render(); }
  catch(x){ $('#err').textContent=x instanceof SyntaxError||x.name==='TypeError'?'Could not read data.enc.json':'Wrong password'; $('#pw').select(); }
};

const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const isUrl=v=>/^https?:\/\//i.test(v);
// plain-text version of any value, used for copying containers
function text(v,ind=''){
  if(isObj(v)) return Object.entries(v).map(([k,x])=>(isObj(x)||Array.isArray(x))?`${ind}${k}:\n${text(x,ind+'  ')}`:`${ind}${k}: ${x}`).join('\n');
  if(Array.isArray(v)) return v.map(x=>(isObj(x)||Array.isArray(x))?text(x,ind):ind+x).join('\n');
  return ind+v;
}
function el(t,c,h){const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function copyBtn(get){
  const b=el('button','cp','⧉'); b.title='Copy';
  b.onclick=async()=>{ await navigator.clipboard.writeText(get()); b.classList.add('done'); b.textContent='✓';
    const t=$('#toast'); t.classList.add('show'); setTimeout(()=>{b.classList.remove('done');b.textContent='⧉';t.classList.remove('show')},1100); };
  return b;
}
// one renderer for every shape: string -> row, object/array -> nested container
function node(key,val){
  if(isObj(val)||Array.isArray(val)){
    const d=el('div','sub'), h=el('div','head'); h.append(el('h3',0,esc(key)),copyBtn(()=>`${key}:\n${text(val,'  ')}`)); d.append(h);
    if(Array.isArray(val)) val.forEach((x,i)=>d.append(node(Array.isArray(x)||isObj(x)?`#${i+1}`:key,x)));
    else for(const[k,x] of Object.entries(val)) d.append(node(k,x));
    return d;
  }
  const r=el('div','row'), l=el('div');
  l.append(el('span','k',esc(key)), isUrl(val)?Object.assign(el('a','v',esc(val)),{href:val,target:'_blank',rel:'noopener'}):el('span','v',esc(val)));
  r.append(l,copyBtn(()=>String(val))); return r;
}
function render(){
  const all=[...new Set(items.flatMap(i=>i.tags||[]))].sort();
  const tg=$('#tags'); tg.innerHTML='';
  ['all',...all].forEach(t=>{const b=el('button','tag'+(t===active?' on':''),esc(t)); b.onclick=()=>{active=t;render()}; tg.append(b)});
  const g=$('#grid'); g.innerHTML='';
  const list=items.filter(i=>(active==='all'||(i.tags||[]).includes(active))&&(JSON.stringify(i).toLowerCase().includes(query)));
  if(!list.length) g.append(el('div','empty','Nothing matches. Clear the search or pick another tag.'));
  list.forEach(i=>{
    const c=el('div','card'), h=el('div','head');
    h.append(el('h2',0,esc(i.title)),copyBtn(()=>`${i.title}\n${text(i.data)}`)); c.append(h);
    if(i.tags?.length) c.append(el('div','chips',i.tags.map(t=>`<span>#${esc(t)}</span>`).join('')));
    for(const[k,v] of Object.entries(i.data||{})) c.append(node(k,v));
    g.append(c);
  });
}
$('#q').oninput=e=>{query=e.target.value.toLowerCase();render()};
</script><script>
// abstract background: drifting neon orbs + a particle web that reacts to the pointer
(()=>{
const cv=document.getElementById('bg'),cx=cv.getContext('2d'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,m={x:-999,y:-999};
const cols=['94,238,214','162,132,255','255,111,181'];
const orbs=cols.map((c,i)=>({c,x:Math.random(),y:Math.random(),r:.35+i*.05,a:Math.random()*6.28,s:.00012+i*.00004}));
const pts=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;pts.length=0;for(let i=0;i<Math.min(70,W*H/16000|0);i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25})}
addEventListener('resize',size);size();
addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY});
addEventListener('pointerleave',()=>{m.x=m.y=-999});
function draw(t){
  cx.clearRect(0,0,W,H);
  orbs.forEach(o=>{o.a+=o.s*16;const x=(o.x+Math.cos(o.a)*.12)*W,y=(o.y+Math.sin(o.a*1.3)*.12)*H,r=o.r*Math.max(W,H);
    const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${o.c},.10)`);g.addColorStop(1,`rgba(${o.c},0)`);cx.fillStyle=g;cx.fillRect(0,0,W,H)});
  pts.forEach((p,i)=>{
    if(!still){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      const dx=m.x-p.x,dy=m.y-p.y,d=Math.hypot(dx,dy);if(d<160){p.x-=dx/d*.6;p.y-=dy/d*.6}}
    cx.fillStyle='rgba(94,238,214,.35)';cx.beginPath();cx.arc(p.x,p.y,1.4,0,6.28);cx.fill();
    for(let j=i+1;j<pts.length;j++){const q=pts[j],d=Math.hypot(p.x-q.x,p.y-q.y);
      if(d<120){cx.strokeStyle=`rgba(162,132,255,${.16*(1-d/120)})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}
    const d=Math.hypot(m.x-p.x,m.y-p.y);if(d<170){cx.strokeStyle=`rgba(94,238,214,${.35*(1-d/170)})`;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(m.x,m.y);cx.stroke()}
  });
  if(!still)requestAnimationFrame(draw);
}
draw();
// soft spotlight that follows the pointer inside each card
document.addEventListener('pointermove',e=>{const c=e.target.closest?.('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}});
})();
</script>
</body></html>
